# Publishes the site to GitHub Pages (docs/deploy.md). In the public repository every push to master deploys: a push
# there is a release synced from the private repository (decisions/public-sync). In the private repository it never
# runs on a push (no Pages there, and its Actions minutes are limited); either one can still be run by hand.
# The address and the base path come from the repository's owner and name.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      map_source:
        description: 'Map source: official (UESP-sourced official maps, the site''s own) or drawn (the takedown fallback)'
        required: true
        default: official
        type: choice
        options: [drawn, official]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A skipped job takes no runner minutes.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build
        env:
          CHRONICLE_STRICT: '1'
          CHRONICLE_SITE: https://${{ github.repository_owner }}.github.io
          CHRONICLE_BASE: /${{ github.event.repository.name }}/
          # A push has no inputs: the official maps, as the site uses.
          PUBLIC_MAP_SOURCE: ${{ inputs.map_source || 'official' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
